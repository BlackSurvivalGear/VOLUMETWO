name: Calendar booking validation
on:
  pull_request:
    paths:
      - 'apps-script/**'
      - 'script.js'
      - '.github/workflows/calendar-booking-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: apps-script
