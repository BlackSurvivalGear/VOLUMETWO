<!doctype html><meta charset="utf-8"><title>Volume Two Calendar Endpoint Test</title><h1>Calendar endpoint smoke test</h1><p>After deploying the Apps Script web app, paste its /exec URL below and click Test availability.</p><input id="url" size="80" placeholder="https://script.google.com/macros/s/.../exec"><button id="test">Test availability</button><pre id="out"></pre><script>document.querySelector('#test').onclick=async()=>{const out=document.querySelector('#out');out.textContent='Testing…';try{const u=document.querySelector('#url').value.trim();const r=await fetch(u+'?action=availability');const d=await r.json();out.textContent=JSON.stringify(d,null,2);}catch(e){out.textContent='ERROR: '+e.message;}};</script>
